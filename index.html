<style>

    {t:"The Prestige",l:"English",y:2006,d:"medium",hint:"Obsessive Rivalry Between Two Stage Illusionists",decoys:["Shutter Island","Memento","Fight Club"],pool:["The Prestige","Shutter Island","Memento","Fight Club","Knives Out"]},

    {t:"Parasite",l:"Korean",y:2019,d:"easy",hint:"Class-Divide Con Job Inside a Luxury Architect House",decoys:["Knives Out","Oldboy","Memories of Murder"],pool:["Parasite","Knives Out","Oldboy","Memories of Murder","Train to Busan"]}

const LS=(k,v)=>{try{if(v===undefined)return localStorage[k];localStorage[k]=v}catch(e){}};
let uid=LS('uid')||Math.random().toString(36).slice(2,10);LS('uid',uid);
let code,room,MOV=[],peek=false,lastPhase,lastTurn;
let cfg={DK:'standard',L:'all',P:'0-3000',D:'all',I:'auto',HM:'spoken',T:120,W:0,C:1,K:1,PR:1,Y1:'',Y2:'',X:''};
const app=document.getElementById('app'),$=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
fetch('movies.json').then(r=>r.json()).then(j=>MOV=j.movies.map(a=>({t:a[0],l:a[1],y:a[2],d:a[3]}))).catch(()=>{});
function localGet(path){
  let value=room;
  for(const key of path.split('/').filter(Boolean)){
    if(value==null)return undefined;
    value=value[key];
  }
  return value;
}
function localSet(path,value,remove=false){
  if(!room)return;
  const keys=path.split('/').filter(Boolean);
  if(!keys.length){if(remove)return;room=value;return render();}
  let target=room;
  for(let i=0;i<keys.length-1;i++){
    if(target[keys[i]]==null||typeof target[keys[i]]!='object')target[keys[i]]={};
    target=target[keys[i]];
  }
  if(remove)delete target[keys[keys.length-1]];
  else target[keys[keys.length-1]]=value;
  render();
}
const ref=(path='')=>({
  set:value=>{localSet(path,value);return Promise.resolve()},
  update:value=>{
    for(const [key,nested] of Object.entries(value)){
      localSet(path?path+'/'+key:key,nested);
    }
    render();
    return Promise.resolve();
  },
  remove:()=>{localSet(path,undefined,true);return Promise.resolve()},
  transaction:fn=>{
    const current=localGet(path);
    localSet(path,fn(current));
    return Promise.resolve({committed:true});
  },
  on:()=>{},
  off:()=>{},
  get:()=>Promise.resolve({exists:()=>false,val:()=>null})
});
const P=()=>room.players||{},isHost=()=>room.host==uid,isImp=()=>(room.imp||[]).includes(uid),SC=i=>(room.scores||{})[i]||0;
const S=(k,o)=>`<select onchange="cfg.${k}=this.value;if('${k}'==='DK')render()">${o.map(([v,l])=>`<option value="${v}" ${cfg[k]==v?'selected':''}>${l}</option>`).join('')}</select>`;
function beep(f=660){try{const a=new(window.AudioContext||webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=f;g.gain.setValueAtTime(.15,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.14);o.start();o.stop(a.currentTime+.14)}catch(e){}try{navigator.vibrate(20)}catch(e){}}

setInterval(()=>{const e=$('#tm');if(e&&room&&room.tEnd)e.textContent=Math.max(0,Math.ceil((room.tEnd-Date.now())/1000))+'s'},300);
const pre=(new URLSearchParams(location.search)).get('r')||'';

function home(){
  app.innerHTML=`<section class="hero">
    <div class="hero-kicker">One phone. One secret role. Fully offline.</div>
    <h2>The movie is known.<br>The imposter is not.</h2>
    <p>Pass the phone, read the clues, interrogate your friends, and expose the imposter.</p>
  </section>
  <div class="c">
    <div class="mut" style="margin:0 0 4px">PLAYER NAMES</div>
    <textarea id="n" rows="4" maxlength="280" placeholder="One name per line&#10;Alex&#10;Sam&#10;Taylor&#10;Jordan">${esc(LS('ln')||'')}</textarea>
    <button onclick="create()">START OFFLINE SCREENING</button>
  </div>`;
}
function leaveRoom(){if(code)ref().off();LS('rc','');code=null;room=null;home()}
function name(){const n=$('#n').value.trim();if(!n)alert('Enter at least 3 player names');return n}
function create(){
  const text=name();if(!text)return;
  const names=[...new Set(text.split(/[\n,]+/).map(n=>n.trim()).filter(Boolean))];
  if(names.length<3)return alert('You need at least 3 players');
  LS('ln',names.join('\n'));
  enter('OFFLINE',names);
}
function enter(c,names){
  code=c;
  const players={};
  names.forEach((name,index)=>players['p'+(index+1)]=name);
  uid='p1';
  LS('uid',uid);
  room={host:uid,phase:'lobby',players,scores:{}};
  render();
}

function roleCard(){
  const r=room,s=r.s||{};let b='';
  if(isImp()&&r.decoy)b=`<div class="t-ser">ADMIT ONE • SCREEN 01</div><div class="mut">Your Assigned Movie</div><div class="big">${esc(r.decoy)}</div>${s.clue&&r.my?`<div class="t-div"></div><div class="mut">${esc(r.ml)} • ${r.my}</div>`:''}`;
  else if(isImp())b=`<div class="t-ser">UNLISTED CAST • BLUFF</div><div class="big imp">🎭 IMPOSTER</div><div class="mut">Blend in with your clue!</div>${s.clue?`<div class="t-div"></div><div class="badge">${esc(r.mHint||(r.ml+', '+Math.floor((r.my||2010)/10)*10+'s'))}</div>`:''}`;
  else b=`<div class="t-ser">ADMIT ONE • SCREEN 01</div><div class="mut">Your Assigned Movie</div><div class="big">${esc(r.movie)}</div>${s.clue?`<div class="t-div"></div><div class="mut">${esc(r.ml)}${r.my?' • '+r.my:''}</div>`:''}`;
  return `<div class="stub ${peek?'peek':''}" id="stub" oncontextmenu="return false">
    <div class="shut"><div class="clap"></div><div style="font-size:22px;margin-top:6px">🎟️</div><div style="font-weight:800;letter-spacing:1.4px">CONFIDENTIAL TICKET</div><div class="mut">Shield screen from others</div><div class="pill">HOLD OR TAP TO PEEK</div></div>
    <div class="t-in">${b}</div>
  </div>`;
}
function bindStub(){
  const el=$('#stub');if(!el)return;let t0=0;
  el.onpointerdown=()=>{t0=Date.now();el.classList.add('peek');try{navigator.vibrate(12)}catch(e){}};
  const end=()=>{if(Date.now()-t0>220){el.classList.remove('peek');peek=false}else{peek=!peek;el.classList.toggle('peek',peek)}};
  el.onpointerup=end;el.onpointercancel=()=>{el.classList.remove('peek');peek=false};
}
function promptBox(){
  if(!room.pTag||!room.pTxt)return '';
  return `<div class="pbox"><span class="badge">🎬 DIRECTOR'S CUT: ${esc(room.pTag)}</span><div class="ptxt">${esc(room.pTxt)}</div></div>`;
}
function hintBox(){
  const h=room.hints||{},ids=Object.keys(P());
  if(ids.every(i=>h[i]))return `<div class="c"><b>Clue Reel</b>${ids.map(i=>`<div class="row"><span>${esc(P()[i])}</span><b>${esc(h[i])}</b></div>`).join('')}</div>`;
  return `<div class="c">${h[uid]?'<div class="mut" style="text-align:center">Clue locked in ✔</div>':`<input id="h" placeholder="Type your clue" maxlength="40"><button onclick="sendHint()">Lock In Clue</button>`}<div class="mut" style="text-align:center">${Object.keys(h).length}/${ids.length} submitted</div></div>`;
}

function render(){
  const ph=room.phase,pl=P(),ids=Object.keys(pl),s=room.s||{};
  const phases=['lobby','play','talk','vote','result'];
  const active=phases.indexOf(ph);
  let h=`<div class="phase-strip">${phases.map((p,i)=>`<span class="phase-dot ${i<=active?'active':''}" title="${p}"></span>`).join('')}</div>
  <div class="c"><div class="row"><div><div class="mut">OFFLINE MODE</div><div class="big code" style="font-size:21px;text-align:left">PASS & PLAY</div></div>
  <div style="display:flex;gap:6px"><button class="g" style="width:auto;padding:9px 10px" onclick="leaveRoom()">EXIT</button></div></div></div>`;
  
  if(ph=='lobby'){
    h+=`<div class="c"><div class="row"><b>THE CAST</b><span class="badge">${ids.length} players</span></div><div class="cast-grid">${ids.map(i=>`<div class="cast-item"><span>${esc(pl[i])}${i==room.host?' <span class="mut">HOST</span>':''}</span><span class="pts">${SC(i)} pts</span>${isHost()&&i!=uid?`<button class="g" style="width:auto;padding:4px 7px;margin:0" onclick="kick('${i}')">×</button>`:''}</div>`).join('')}</div></div>`;
    if(isHost()){
      const dkOpts=[['standard','📚 Full 300+ Movie Database'],...Object.entries(DECKS).map(([k,v])=>[k,v.name])];
      h+=`<div class="c"><b>Director's Cut Settings</b>${S('DK',dkOpts)}`;
      if(cfg.DK==='standard'){
        h+=`${S('L',[['all','All languages'],...['English','Tamil','Hindi','Telugu','Malayalam','Kannada','Korean','Japanese'].map(l=>[l,l])])}
        ${S('P',[['0-3000','Any year'],['0-1989','Before 1990'],['1990-1999','1990s'],['2000-2009','2000s'],['2010-2019','2010s'],['2020-3000','2020s']])}
        <div class="row"><span class="mut">Custom years</span><input type="number" placeholder="from" value="${cfg.Y1}" onchange="cfg.Y1=this.value"><input type="number" placeholder="to" value="${cfg.Y2}" onchange="cfg.Y2=this.value"></div>
        ${S('D',[['all','Any difficulty'],['easy','Easy'],['medium','Medium'],['hard','Hard']])}`;
      }
      h+=`${S('C',[[1,'Undercover Mode: Imposter gets twin decoy movie'],[0,'Classic Mode: Imposter sees IMPOSTER']])}
      ${S('PR',[[1,"Director's Cut Prompts: ON"],[0,"Director's Cut Prompts: OFF"]])}
      ${S('I',[['auto','Imposters: Auto'],['1','1 Imposter'],['2','2 Imposters']])}
      ${S('HM',[['spoken','Clues: Spoken in turn (Multiple Hints)'],['typed','Clues: Typed & revealed together']])}
      ${S('T',[[60,'Discussion 1 min'],[120,'Discussion 2 min'],[180,'Discussion 3 min'],[300,'Discussion 5 min']])}
      ${S('W',[[0,'Endless rounds'],[5,'First to 5 pts'],[10,'First to 10 pts']])}
      ${S('K',[[1,'Show era/vibe clue'],[0,'No clues']])}
      <textarea rows="2" placeholder="Custom movie pack (optional): one per line" oninput="cfg.X=this.value">${esc(cfg.X)}</textarea>
      <button onclick="start()" ${ids.length<3?'disabled':''}>${ids.length<3?'Need 3+ Players':'🎬 Action! Start Round'}</button></div>`;
    }else h+=`<div class="c mut" style="text-align:center">Waiting for host to start the reel…</div>`;
  }else if(ph=='play'){
    h+=roleCard()+promptBox();
    if(s.typed)h+=hintBox()+(isHost()?`<button onclick="talk()">Start Discussion</button>`:'');
    else{
      const cur=room.order[room.turn];
      const queueList = room.order.map((id, idx) => {
        const isDone = idx < room.turn;
        const isCurrent = idx === room.turn;
        let mark = isDone ? '✓ Done' : (isCurrent ? '👉 Speaking Now' : '⏳ Waiting');
        let style = isCurrent ? 'color:var(--gold2);font-weight:700;' : (isDone ? 'color:var(--mut);' : '');
        return `<div class="q-item" style="${style}"><span>${idx+1}. ${esc(pl[id]||'?')} ${id==uid?'(You)':''}</span><span class="badge" style="font-size:10px">${mark}</span></div>`;
      }).join('');

      h+=`<div class="c" style="text-align:center">
        <div class="mut">🗣️ HINT ROUND • Turn ${room.turn+1} of ${room.order.length}</div>
        <div class="big" style="margin:4px 0">${esc(pl[cur]||'?')}${cur==uid?' (YOUR TURN TO SAY A HINT!)':''}</div>
        <div class="queue-box"><div class="mut" style="margin-bottom:6px">Speaking Queue Order:</div>${queueList}</div>
        <div class="mut" style="margin:8px 0">Say your hint out loud, then tap done when finished.</div>
        ${cur==uid||isHost()?`<button class="gold" onclick="next()">Done With My Hint ✅</button>`:''}
      </div>`;
    }
  }else if(ph=='talk'){
    h+=roleCard()+promptBox()+(s.typed?hintBox():'')+`<div class="c" style="text-align:center"><div class="mut">Interrogation Room • Open Discussion!</div><div class="tm" id="tm"></div></div>`+(isHost()?`<button onclick="ref('phase').set('vote')">🗳️ Start Voting</button>`:'');
  }else if(ph=='vote'){
    const v=room.votes||{};
    h+=`<div class="c">
      <b>🎯 Choose who you think is the Imposter:</b>
      <span class="mut" style="display:block;margin-bottom:8px">${Object.keys(v).length}/${ids.length} voted</span>
      ${ids.filter(i=>i!=uid).map(i=>`<button class="${v[uid]==i?'':'g'}" onclick="beep(520);ref('votes/${uid}').set('${i}')">${esc(pl[i])}${v[uid]==i?' 🎯 (Selected)':''}</button>`).join('')}
    </div>`+(isHost()?`<button class="gold" onclick="reveal()">Reveal Verdict & Scores</button>`:'');
  }else if(ph=='result'){
    const imp=room.imp||[],v=room.votes||{},cnt={};Object.values(v).forEach(x=>cnt[x]=(cnt[x]||0)+1);
    const sorted=[...ids].sort((a,b)=>SC(b)-SC(a)),win=s.win&&SC(sorted[0])>=s.win;
    
    h+=`<div class="c" style="text-align:center">
      <div class="mut">The Imposter${imp.length>1?'s':''}</div>
      <div class="big imp">${imp.map(i=>esc(pl[i]||'?')).join(' & ')}</div>
      <div style="margin:8px 0">Movie: <b style="color:var(--gold2)">${esc(room.movie)}</b>${room.decoy?`<br><span class="mut">(Decoy shown: ${esc(room.decoy)})</span>`:''}</div>
      <div class="badge">${room.caught?'✅ IMPOSTER CAUGHT!':'😈 IMPOSTER ESCAPED!'}</div>
      ${room.guess?`<div style="margin-top:8px">Heist Guess: <b>${esc(room.guess)}</b></div>`:''}
    </div>`;

    if(room.caught&&isImp()&&!room.guess){
      const lp=room.pool||[];
      h+=`<div class="c"><b>⚡ Box Office Heist: Guess the movie (+1 pt steal)</b>${lp.length?lp.map(t=>`<button class="g" data-t="${esc(t)}" onclick="guessTitle(this.dataset.t)">${esc(t)}</button>`).join(''):`<input id="g" placeholder="Movie name"><button onclick="guess()">Submit Guess</button>`}</div>`;
    }

    if(win)h+=`<div class="c big">🏆 ${esc(pl[sorted[0]])} Wins Match!</div>`;
    h+=`<div class="c"><b>Standings</b>${sorted.map(i=>`<div class="row"><span>${esc(pl[i])} <span class="mut">(${cnt[i]||0} votes)</span></span><b>${SC(i)} pts</b></div>`).join('')}</div>`+(isHost()?`<button onclick="${win?"ref('scores').remove();":''}ref('phase').set('lobby')">${win?'New Match':'Next Round 🎬'}</button>`:'');
  }
  app.innerHTML=h;bindStub();
}
function kick(i){ref('players/'+i).remove()}
function pickDecoy(m,pool){
  if(m.decoys&&m.decoys.length)return m.decoys[Math.random()*m.decoys.length|0];
  const c=(MOV.length?MOV:pool).filter(x=>x.l==m.l&&x.t!=m.t);if(!c.length)return null;
  const r=c.map(x=>({t:x.t,s:(x.d==m.d?0:15)+Math.abs((x.y||2015)-(m.y||2015))})).sort((a,b)=>a.s-b.s).slice(0,6);
  return r[Math.random()*r.length|0].t;
}
function makePool(m,decoy,pool){
  if(m.pool&&m.pool.length)return [...m.pool].sort(()=>Math.random()-.5);
  const s=new Set([m.t]);if(decoy)s.add(decoy);
  const c=(MOV.length?MOV:pool).filter(x=>x.l==m.l&&!s.has(x.t)).sort((a,b)=>Math.abs((a.y||2015)-(m.y||2015))-Math.abs((b.y||2015)-(m.y||2015)));
  for(const x of c){if(s.size>=5)break;s.add(x.t)}
  return Array.from(s).sort(()=>Math.random()-.5);
}
function start(){
  let[a,b]=cfg.P.split('-').map(Number);if(cfg.Y1)a=+cfg.Y1;if(cfg.Y2)b=+cfg.Y2;
  const custom=cfg.X.split('\n').map(x=>x.trim()).filter(Boolean);
  let pool=custom.length?custom.map(t=>({t,l:'Custom',y:'',d:''})):(cfg.DK!=='standard'&&DECKS[cfg.DK]?DECKS[cfg.DK].movies:MOV.filter(m=>(cfg.L=='all'||m.l==cfg.L)&&m.y>=a&&m.y<=b&&(cfg.D=='all'||m.d==cfg.D)));
  if(!pool.length)return alert('No movies match. Loosen the filters.');
  const ids=Object.keys(P()).sort(()=>Math.random()-.5),n=ids.length,k=cfg.I=='auto'?(n>=7?2:1):Math.min(+cfg.I,Math.max(1,Math.floor((n-1)/2)));
  const m=pool[Math.random()*pool.length|0],decoy=+cfg.C?pickDecoy(m,pool):null,heist=makePool(m,decoy,pool);
  const pr=+cfg.PR?PROMPTS[Math.random()*PROMPTS.length|0]:[null,null];
  ref().update({phase:'play',movie:m.t,my:m.y||0,ml:m.l||'Cinema',mHint:m.hint||null,decoy,pool:heist,pTag:pr[0],pTxt:pr[1],imp:ids.slice(0,k),order:[...ids].sort(()=>Math.random()-.5),turn:0,hints:null,votes:null,guess:null,caught:null,s:{typed:cfg.HM=='typed',talk:+cfg.T,win:+cfg.W,clue:!!(+cfg.K&&(m.y||m.hint))}});
}
function next(){
  const t=room.turn+1;
  if(t>=room.order.length)talk();
  else ref().update({turn:t});
}
function talk(){ref().update({phase:'talk',tEnd:Date.now()+(room.s.talk||120)*1000})}
function sendHint(){const v=$('#h').value.trim();if(v)ref('hints/'+uid).set(v)}
function reveal(){
  const v=room.votes||{},ids=Object.keys(P()),impList=room.imp||[];
  let correctVotes=0, totalVotes=0;

  // Calculate scores based on user rules
  ids.forEach(i=>{
    const votedFor=v[i];
    const isImp=impList.includes(i);
    if(votedFor && impList.includes(votedFor)){
      if(!isImp) correctVotes++;
    }
    totalVotes++;
  });

  const caught=correctVotes >= Math.ceil((ids.length - impList.length)/2);
  const everyoneChoseCorrectly = (correctVotes === (ids.length - impList.length));

  ids.forEach(i=>{
    const isImp=impList.includes(i);
    const votedFor=v[i];
    let delta=0;

    if(caught){
      // Imposter caught
      if(isImp){
        delta=0;
      } else {
        // Crew member
        if(votedFor && impList.includes(votedFor)) delta = 1; // +1 if correct
        else delta = -0.5; // -0.5 if wrong
      }
    } else {
      // Imposter escaped
      if(isImp){
        if(everyoneChoseCorrectly) delta = -0.5; // -0.5 if everyone chose imposter
        else delta = 1; // +1 for escaping
      } else {
        if(votedFor && impList.includes(votedFor)) delta = 1; // +1 if they got it right anyway
        else delta = -0.5; // -0.5 if wrong
      }
    }

    if(delta !== 0){
      ref('scores/'+i).transaction(s => Math.round(((s||0) + delta)*10)/10);
    }
  });

  ref().update({phase:'result',caught});
}
function guessTitle(g){if(!g||room.guess)return;const ok=g.toLowerCase()==room.movie.toLowerCase();if(ok)ref('scores/'+uid).transaction(s=>Math.round(((s||0)+1)*10)/10);ref('guess').set(g+(ok?' ✔ (+1 Steal!)':' ✘'))}
function guess(){const g=$('#g').value.trim();if(g)guessTitle(g)}
home();
</script></body></html>
