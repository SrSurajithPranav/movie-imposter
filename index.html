<style>

.code{letter-spacing:6px;font-family:ui-monospace,monospace}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 0}
.row button,.row input{width:auto;padding:6px 12px;margin:0}.row input{width:90px}
.imp{color:var(--red)}.mut{color:var(--mut);font-size:13px}

.ptxt{font-size:15px;font-weight:600;color:var(--cream);margin-top:5px}
.stub{position:relative;width:100%;min-height:210px;background:#141311;color:var(--cream);border:1.5px solid var(--gold);border-radius:16px;overflow:hidden;user-select:none;-webkit-user-select:none;box-shadow:0 18px 40px rgba(0,0,0,.7);margin:12px 0;cursor:pointer}
.t-in{padding:24px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:210px;background:radial-gradient(circle at 50% 20%,rgba(212,175,55,.14),transparent 70%)}

.t-div{width:80%;border-top:1px dashed rgba(212,175,55,.35);margin:10px 0 6px}
.shut{position:absolute;inset:0;background:repeating-linear-gradient(-45deg,#1b1a17,#1b1a17 14px,#25231f 14px,#25231f 28px);border-bottom:3px solid var(--gold);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;padding:20px;text-align:center;transition:transform .28s cubic-bezier(.16,1,.3,1)}
.stub.peek .shut{transform:translateY(-90%)}
.clap{width:100%;height:16px;position:absolute;top:0;left:0;background:repeating-linear-gradient(-45deg,var(--gold),var(--gold) 14px,#111 14px,#111 28px);border-bottom:2px solid #000}
.pill{margin-top:10px;padding:7px 16px;border-radius:99px;background:rgba(212,175,55,.15);border:1px solid var(--gold);color:var(--gold2);font-weight:700;font-size:12px;letter-spacing:.8px}
.fuse-bar{width:100%;height:8px;background:#23222b;border-radius:4px;overflow:hidden;margin:10px 0}
.fuse-fill{height:100%;background:linear-gradient(90deg,var(--gold2),var(--red));width:100%;transition:width .3s linear}
</style></head><body>

firebase.initializeApp(CFG);const db=firebase.database();
const LS=(k,v)=>{try{if(v===undefined)return localStorage[k];localStorage[k]=v}catch(e){}};
let uid=LS('uid')||Math.random().toString(36).slice(2,10);LS('uid',uid);
let code,room,MOV=[],peek=false,lastPhase,lastTurn;
let cfg={DK:'standard',L:'all',P:'0-3000',D:'all',I:'auto',HM:'spoken',T:120,W:0,C:1,K:1,PR:1,Y1:'',Y2:'',X:''};
const app=document.getElementById('app'),$=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
fetch('movies.json').then(r=>r.json()).then(j=>MOV=j.movies.map(a=>({t:a[0],l:a[1],y:a[2],d:a[3]}))).catch(()=>{});
const ref=p=>db.ref('rooms/'+code+(p?'/'+p:''));
const P=()=>room.players||{},isHost=()=>room.host==uid,isImp=()=>(room.imp||[]).includes(uid),SC=i=>(room.scores||{})[i]||0;
const S=(k,o)=>`<select onchange="cfg.${k}=this.value;if('${k}'==='DK')render()">${o.map(([v,l])=>`<option value="${v}" ${cfg[k]==v?'selected':''}>${l}</option>`).join('')}</select>`;
function beep(f=660){try{const a=new(window.AudioContext||webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=f;g.gain.setValueAtTime(.15,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.14);o.start();o.stop(a.currentTime+.14)}catch(e){}try{navigator.vibrate(20)}catch(e){}}

setInterval(()=>{
  const e=$('#tm'),f=$('#fuse');
  if(room&&room.tEnd){
    const rem=Math.max(0,Math.ceil((room.tEnd-Date.now())/1000));
    if(e)e.textContent=rem+'s';
    if(f){
      const pct=Math.max(0,(rem/15)*100);
      f.style.width=pct+'%';
    }
    if(rem===0&&isHost()&&room.phase=='play'){next()}
  }
},300);

const pre=(new URLSearchParams(location.search)).get('r')||'';

function home(){
  app.innerHTML=`<div class="c"><div class="mut">Player Ticket Name</div><input id="n" placeholder="Your name" maxlength="14" value="${esc(LS('ln')||'')}"><button onclick="create()">🎟️ Create Screening Room</button></div>
  <div class="c"><div class="mut">Have an Invite Code?</div><input id="c" placeholder="6-digit room code" inputmode="numeric" maxlength="6" value="${esc(pre)}"><button class="g" onclick="joinRoom()">Join Room</button></div>`;
}
function leaveRoom(){if(code)ref().off();LS('rc','');code=null;room=null;home()}
function name(){const n=$('#n').value.trim();if(!n)alert('Enter your name');return n}
async function create(){const n=name();if(!n)return;const c=String(100000+Math.random()*900000|0);await db.ref('rooms/'+c).set({host:uid,phase:'lobby'});enter(c,n)}
async function joinRoom(){const n=name();if(!n)return;const c=$('#c').value.trim();const s=await db.ref('rooms/'+c).get();
  if(!s.exists())return alert('Room not found');const v=s.val(),pl=v.players||{};
  const old=Object.keys(pl).find(i=>pl[i].toLowerCase()==n.toLowerCase());
  if(old){uid=old;LS('uid',uid)}else if(v.phase!='lobby')return alert('Game already started. Rejoin with your exact old name.');
  enter(c,n);
}
function enter(c,n){
  code=c;LS('rc',c);LS('ln',n);ref('players/'+uid).set(n);
  ref().on('value',x=>{
    room=x.val();if(!room){LS('rc','');alert('Room closed');return home()}
    if(!P()[uid]){LS('rc','');return home()}
    if(room.phase!=lastPhase){peek=false;lastPhase=room.phase}
    const my=room.phase=='play'&&room.order&&room.order[room.turn]==uid&&!(room.s||{}).typed;
    if(my&&lastTurn!=room.turn)beep(740);lastTurn=my?room.turn:null;render();
  });
}
(async()=>{const c=LS('rc');if(c&&!pre){try{const s=await db.ref('rooms/'+c+'/players/'+uid).get();if(s.exists())enter(c,s.val())}catch(e){}}})();

function roleCard(){
  const r=room,s=r.s||{};let b='';
  if(isImp()&&r.decoy)b=`<div class="t-ser">ADMIT ONE • SCREEN 01</div><div class="mut">Your Assigned Movie</div><div class="big">${esc(r.decoy)}</div>${s.clue&&r.my?`<div class="t-div"></div><div class="mut">${esc(r.ml)} • ${r.my}</div>`:''}`;
  else if(isImp())b=`<div class="t-ser">UNLISTED CAST • BLUFF</div><div class="big imp">🎭 IMPOSTER</div><div class="mut">Blend in with your clue!</div>${s.clue?`<div class="t-div"></div><div class="badge">${esc(r.mHint||(r.ml+', '+Math.floor((r.my||2010)/10)*10+'s'))}</div>`:''}`;
  else b=`<div class="t-ser">ADMIT ONE • SCREEN 01</div><div class="mut">Your Assigned Movie</div><div class="big">${esc(r.movie)}</div>${s.clue?`<div class="t-div"></div><div class="mut">${esc(r.ml)}${r.my?' • '+r.my:''}</div>`:''}`;
  return `<div class="stub ${peek?'peek':''}" id="stub" oncontextmenu="return false">
    <div class="shut"><div class="clap"></div><div style="font-size:22px;margin-top:6px">🎟️</div><div style="font-weight:800;letter-spacing:1.4px">CONFIDENTIAL TICKET</div><div class="mut">Shield screen from others</div><div class="pill">HOLD OR TAP TO PEEK</div></div>
    <div class="t-in">${b}</div>
  </div>`;
}
function bindStub(){
  const el=$('#stub');if(!el)return;let t0=0;
  el.onpointerdown=()=>{t0=Date.now();el.classList.add('peek');try{navigator.vibrate(12)}catch(e){}};
  const end=()=>{if(Date.now()-t0>220){el.classList.remove('peek');peek=false}else{peek=!peek;el.classList.toggle('peek',peek)}};
  el.onpointerup=end;el.onpointercancel=()=>{el.classList.remove('peek');peek=false};
}
function promptBox(){
  if(!room.pTag||!room.pTxt)return '';
  return `<div class="pbox"><span class="badge">🎬 DIRECTOR'S CUT: ${esc(room.pTag)}</span><div class="ptxt">${esc(room.pTxt)}</div></div>`;
}
function hintBox(){
  const h=room.hints||{},ids=Object.keys(P());
  if(ids.every(i=>h[i]))return `<div class="c"><b>Clue Reel</b>${ids.map(i=>`<div class="row"><span>${esc(P()[i])}</span><b>${esc(h[i])}</b></div>`).join('')}</div>`;
  return `<div class="c">${h[uid]?'<div class="mut" style="text-align:center">Clue locked in ✔</div>':`<input id="h" placeholder="Type your clue" maxlength="40"><button onclick="sendHint()">Lock In Clue</button>`}<div class="mut" style="text-align:center">${Object.keys(h).length}/${ids.length} submitted</div></div>`;
}

function render(){
  const ph=room.phase,pl=P(),ids=Object.keys(pl),s=room.s||{};
  let h=`<div class="c"><div class="row"><div><div class="mut">Room Code</div><div class="big code" style="font-size:22px;text-align:left">${code}</div></div>
  <div style="display:flex;gap:6px"><button class="g" style="width:auto;padding:8px 12px" onclick="navigator.clipboard.writeText(location.origin+location.pathname+'?r='+code);this.textContent='Copied ✔'">🔗 Invite</button><button class="g" style="width:auto;padding:8px 10px" onclick="leaveRoom()">Exit</button></div></div></div>`;
  if(ph=='lobby'){
    h+=`<div class="c"><b>Cast & Crew (${ids.length})</b>${ids.map(i=>`<div class="row"><span>${esc(pl[i])}${i==room.host?' 👑':''} <span class="mut">• ${SC(i)} pts</span></span>${isHost()&&i!=uid?`<button class="g" onclick="kick('${i}')">Kick</button>`:''}</div>`).join('')}</div>`;
    if(isHost()){
      const dkOpts=[['standard','📚 Full 300+ Movie Database'],...Object.entries(DECKS).map(([k,v])=>[k,v.name])];
      h+=`<div class="c"><b>Director's Cut Settings</b>${S('DK',dkOpts)}`;
      if(cfg.DK==='standard'){
        h+=`${S('L',[['all','All languages'],...['English','Tamil','Hindi','Telugu','Malayalam','Kannada','Korean','Japanese'].map(l=>[l,l])])}
        ${S('P',[['0-3000','Any year'],['0-1989','Before 1990'],['1990-1999','1990s'],['2000-2009','2000s'],['2010-2019','2010s'],['2020-3000','2020s']])}
        <div class="row"><span class="mut">Custom years</span><input type="number" placeholder="from" value="${cfg.Y1}" onchange="cfg.Y1=this.value"><input type="number" placeholder="to" value="${cfg.Y2}" onchange="cfg.Y2=this.value"></div>
        ${S('D',[['all','Any difficulty'],['easy','Easy'],['medium','Medium'],['hard','Hard']])}`;
      }
      h+=`${S('C',[[1,'Undercover Mode: Imposter gets twin decoy movie'],[0,'Classic Mode: Imposter sees IMPOSTER']])}
      ${S('PR',[[1,"Director's Cut Prompts: ON"],[0,"Director's Cut Prompts: OFF"]])}
      ${S('I',[['auto','Imposters: Auto'],['1','1 Imposter'],['2','2 Imposters']])}
      ${S('HM',[['spoken','Clues: Spoken in turn (Hot Potato Blitz)'],['typed','Clues: Typed & revealed together']])}
      ${S('T',[[60,'Discussion 1 min'],[120,'Discussion 2 min'],[180,'Discussion 3 min'],[300,'Discussion 5 min']])}
      ${S('W',[[0,'Endless rounds'],[5,'First to 5 pts'],[10,'First to 10 pts']])}
      ${S('K',[[1,'Show era/vibe clue'],[0,'No clues']])}
      <textarea rows="2" placeholder="Custom movie pack (optional): one per line" oninput="cfg.X=this.value">${esc(cfg.X)}</textarea>
      <button onclick="start()" ${ids.length<3?'disabled':''}>${ids.length<3?'Need 3+ Players':'🎬 Action! Start Round'}</button></div>`;
    }else h+=`<div class="c mut" style="text-align:center">Waiting for host to start the reel…</div>`;
  }else if(ph=='play'){
    h+=roleCard()+promptBox();
    if(s.typed)h+=hintBox()+(isHost()?`<button onclick="talk()">Start Discussion</button>`:'');
    else{
      const cur=room.order[room.turn];
      h+=`<div class="c" style="text-align:center">
        <div class="mut">🔥 HOT POTATO BLITZ • Turn ${room.turn+1}/${room.order.length}</div>
        <div class="big" style="margin:4px 0">${esc(pl[cur]||'?')}${cur==uid?' (YOUR TURN!)':''}</div>
        <div class="tm" id="tm">15s</div>
        <div class="fuse-bar"><div class="fuse-fill" id="fuse"></div></div>
        <div class="mut" style="margin-bottom:8px">Shout your clue out loud before time runs out!</div>
        ${cur==uid||isHost()?`<button class="gold" onclick="next()">Shouted & Done! ⚡</button>`:'' }
      </div>`;
    }
  }else if(ph=='talk'){
    h+=roleCard()+promptBox()+(s.typed?hintBox():'')+`<div class="c" style="text-align:center"><div class="mut">Interrogation Room • Who is bluffing?</div><div class="tm" id="tm"></div></div>`+(isHost()?`<button onclick="ref('phase').set('vote')">🗳️ Start Voting</button>`:'');
  }else if(ph=='vote'){
    const v=room.votes||{};h+=`<div class="c"><b>Vote for the Imposter</b> <span class="mut">${Object.keys(v).length}/${ids.length} voted</span>${ids.filter(i=>i!=uid).map(i=>`<button class="${v[uid]==i?'':'g'}" onclick="beep(520);ref('votes/${uid}').set('${i}')">${esc(pl[i])}${v[uid]==i?' 🎯':''}</button>`).join('')}</div>`+(isHost()?`<button class="gold" onclick="reveal()">Reveal Verdict</button>`:'');
  }else if(ph=='result'){
    const imp=room.imp||[],v=room.votes||{},cnt={};Object.values(v).forEach(x=>cnt[x]=(cnt[x]||0)+1);
    const sorted=[...ids].sort((a,b)=>SC(b)-SC(a)),win=s.win&&SC(sorted[0])>=s.win;
    h+=`<div class="c" style="text-align:center"><div class="mut">Imposter${imp.length>1?'s':''}</div><div class="big imp">${imp.map(i=>esc(pl[i]||'?')).join(' & ')}</div><div style="margin:8px 0">Movie: <b style="color:var(--gold2)">${esc(room.movie)}</b>${room.decoy?`<br><span class="mut">(Decoy shown: ${esc(room.decoy)})</span>`:''}</div>
    <div class="badge">${room.caught?'✅ CAUGHT! CREW +1':'😈 ESCAPED! IMPOSTER +2'}</div>${room.guess?`<div style="margin-top:8px">Heist Guess: <b>${esc(room.guess)}</b></div>`:''}</div>`;
    if(room.caught&&isImp()&&!room.guess){
      const lp=room.pool||[];
      h+=`<div class="c"><b>⚡ Box Office Heist: Guess the movie (+1 pt steal)</b>${lp.length?lp.map(t=>`<button class="g" data-t="${esc(t)}" onclick="guessTitle(this.dataset.t)">${esc(t)}</button>`).join(''):`<input id="g" placeholder="Movie name"><button onclick="guess()">Submit Guess</button>`}</div>`;
    }
    if(win)h+=`<div class="c big">🏆 ${esc(pl[sorted[0]])} Wins!</div>`;
    h+=`<div class="c"><b>Standings</b>${sorted.map(i=>`<div class="row"><span>${esc(pl[i])} <span class="mut">(${cnt[i]||0} votes)</span></span><b>${SC(i)} pts</b></div>`).join('')}</div>`+(isHost()?`<button onclick="${win?"ref('scores').remove();":''}ref('phase').set('lobby')">${win?'New Match':'Next Round 🎬'}</button>`:'');
  }
  app.innerHTML=h;bindStub();
}
function kick(i){ref('players/'+i).remove()}
function pickDecoy(m,pool){
  if(m.decoys&&m.decoys.length)return m.decoys[Math.random()*m.decoys.length|0];
  const c=(MOV.length?MOV:pool).filter(x=>x.l==m.l&&x.t!=m.t);if(!c.length)return null;
  const r=c.map(x=>({t:x.t,s:(x.d==m.d?0:15)+Math.abs((x.y||2015)-(m.y||2015))})).sort((a,b)=>a.s-b.s).slice(0,6);
  return r[Math.random()*r.length|0].t;
}
function makePool(m,decoy,pool){
  if(m.pool&&m.pool.length)return [...m.pool].sort(()=>Math.random()-.5);
  const s=new Set([m.t]);if(decoy)s.add(decoy);
  const c=(MOV.length?MOV:pool).filter(x=>x.l==m.l&&!s.has(x.t)).sort((a,b)=>Math.abs((a.y||2015)-(m.y||2015))-Math.abs((b.y||2015)-(m.y||2015)));
  for(const x of c){if(s.size>=5)break;s.add(x.t)}
  return Array.from(s).sort(()=>Math.random()-.5);
}
function start(){
  let[a,b]=cfg.P.split('-').map(Number);if(cfg.Y1)a=+cfg.Y1;if(cfg.Y2)b=+cfg.Y2;
  const custom=cfg.X.split('\n').map(x=>x.trim()).filter(Boolean);
  let pool=custom.length?custom.map(t=>({t,l:'Custom',y:'',d:''})):(cfg.DK!=='standard'&&DECKS[cfg.DK]?DECKS[cfg.DK].movies:MOV.filter(m=>(cfg.L=='all'||m.l==cfg.L)&&m.y>=a&&m.y<=b&&(cfg.D=='all'||m.d==cfg.D)));
  if(!pool.length)return alert('No movies match. Loosen the filters.');
  const ids=Object.keys(P()).sort(()=>Math.random()-.5),n=ids.length,k=cfg.I=='auto'?(n>=7?2:1):Math.min(+cfg.I,Math.max(1,Math.floor((n-1)/2)));
  const m=pool[Math.random()*pool.length|0],decoy=+cfg.C?pickDecoy(m,pool):null,heist=makePool(m,decoy,pool);
  const pr=+cfg.PR?PROMPTS[Math.random()*PROMPTS.length|0]:[null,null];
  ref().update({phase:'play',movie:m.t,my:m.y||0,ml:m.l||'Cinema',mHint:m.hint||null,decoy,pool:heist,pTag:pr[0],pTxt:pr[1],imp:ids.slice(0,k),order:[...ids].sort(()=>Math.random()-.5),turn:0,tEnd:Date.now()+15000,hints:null,votes:null,guess:null,caught:null,s:{typed:cfg.HM=='typed',talk:+cfg.T,win:+cfg.W,clue:!!(+cfg.K&&(m.y||m.hint))}});
}
function next(){
  const t=room.turn+1;
  if(t>=room.order.length)talk();
  else ref().update({turn:t,tEnd:Date.now()+15000});
}
function talk(){ref().update({phase:'talk',tEnd:Date.now()+(room.s.talk||120)*1000})}
function sendHint(){const v=$('#h').value.trim();if(v)ref('hints/'+uid).set(v)}
function reveal(){
  const v=room.votes||{},cnt={};Object.values(v).forEach(x=>cnt[x]=(cnt[x]||0)+1);
  const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]),tie=top.length>1&&top[0][1]==top[1][1],caught=!!top.length&&!tie&&room.imp.includes(top[0][0]);
  Object.keys(P()).forEach(i=>{const imp=room.imp.includes(i),pts=caught?(imp?0:1):(imp?2:0);if(pts)ref('scores/'+i).transaction(s=>(s||0)+pts)});
  ref().update({phase:'result',caught});
}
function guessTitle(g){if(!g||room.guess)return;const ok=g.toLowerCase()==room.movie.toLowerCase();if(ok)ref('scores/'+uid).transaction(s=>(s||0)+1);ref('guess').set(g+(ok?' ✔ (+1 Steal!)':' ✘'))}
function guess(){const g=$('#g').value.trim();if(g)guessTitle(g)}
home();
</script></body></html>
